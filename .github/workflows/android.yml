
name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and accept licenses
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify build environment
        shell: bash
        run: |
          set -e
          java -version
          gradle --version
          sdkmanager --list_installed
          test -d app
          test -f settings.gradle -o -f settings.gradle.kts
          echo "Android project structure detected."

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::APK was not generated at $APK"
            find . -path '*/build/outputs/apk/*' -type f
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rf-physiology-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
