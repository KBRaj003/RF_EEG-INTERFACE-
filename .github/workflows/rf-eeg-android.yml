name: RF EEG Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          if [ -x ./gradlew ]; then
            ./gradlew --no-daemon --stacktrace assembleDebug
          elif [ -x ./android/gradlew ]; then
            cd android
            ./gradlew --no-daemon --stacktrace assembleDebug
          elif [ -f ./app/build.gradle ] || [ -f ./app/build.gradle.kts ]; then
            gradle --no-daemon --stacktrace assembleDebug
          elif [ -f ./android/app/build.gradle ] || [ -f ./android/app/build.gradle.kts ]; then
            cd android
            gradle --no-daemon --stacktrace assembleDebug
          else
            echo "Android Gradle project not found."
            find . -maxdepth 5 \( -name settings.gradle -o -name settings.gradle.kts -o -name gradlew \)
            exit 1
          fi

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk-output
          find . -type f -path '*/build/outputs/apk/debug/*.apk' -exec cp {} apk-output/ \;
          test -n "$(find apk-output -name '*.apk' -print -quit)"

      - uses: actions/upload-artifact@v4
        with:
          name: rf-eeg-debug-apk
          path: apk-output/*.apk
          if-no-files-found: error
